services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schoolo
      POSTGRES_PASSWORD: schoolo
      POSTGRES_DB: schoolo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolo -d schoolo"]
      interval: 2s
      timeout: 5s
      retries: 10
